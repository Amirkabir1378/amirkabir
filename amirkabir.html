<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه لوکس امیرکبیر</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* --- تم لوکس طلایی (Luxury Gold) --- */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f1d570;
            --gold-dark: #aa8c2c;
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border: #333333;
            --radius: 15px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; outline: none; }
        
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-top: 80px;
            overflow-x: hidden;
            padding-bottom: 80px; /* فضای خالی برای موبایل */
        }

        button { cursor: pointer; border: none; font-family: inherit; transition: 0.3s; }
        input, textarea { 
            background: var(--bg-body); border: 1px solid var(--border); 
            color: white; padding: 10px; border-radius: 8px; width: 100%; font-family: inherit;
        }
        input:focus { border-color: var(--gold-primary); }

        /* --- Header --- */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(30, 30, 30, 0.95);
            border-bottom: 1px solid var(--gold-dark);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .header-inner {
            width: 100%; max-width: 1400px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--gold-primary); cursor: pointer; }
        
        .nav-icons { display: flex; gap: 15px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--border); color: var(--gold-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; position: relative;
        }
        .badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--gold-primary); color: #000;
            font-size: 11px; width: 18px; height: 18px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold;
        }

        /* --- Pages & Tabs --- */
        .page { display: none; max-width: 1400px; margin: 0 auto; padding: 20px; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel-box { background: var(--bg-card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
        
        .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .tab { padding: 10px 0; color: var(--text-sub); cursor: pointer; position: relative; transition: 0.3s; }
        .tab.active { color: var(--gold-primary); font-weight: bold; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; right: 0; width: 100%; height: 2px; background: var(--gold-primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        /* --- Login --- */
        .login-box {
            background: var(--bg-card); padding: 40px; border-radius: 20px;
            text-align: center; max-width: 380px; margin: 60px auto;
            border: 1px solid var(--gold-dark); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .google-btn {
            width: 100%; background: #fff; color: #333;
            padding: 12px; border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 30px; font-size: 14px;
        }
        
        /* --- Products --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 15px;
            border: 1px solid var(--border); transition: 0.3s;
        }
        .card:hover { border-color: var(--gold-primary); transform: translateY(-5px); }
        .card-img {
            height: 180px; background: #000; border-radius: 10px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 50px; color: var(--gold-primary);
        }
        .add-btn {
            width: 100%; padding: 10px; margin-top: 15px;
            background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-primary);
            border-radius: 10px; font-weight: bold;
        }
        .add-btn:hover { background: var(--gold-primary); color: #000; }

        /* --- Address Form & List --- */
        .address-form {
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 20px;
            display: grid; gap: 10px; border: 1px dashed var(--border);
        }
        .address-card {
            background: var(--bg-body); padding: 15px; border-radius: 10px; margin-bottom: 10px;
            border-right: 3px solid var(--gold-primary); display: flex; justify-content: space-between; align-items: center;
        }
        .save-btn { background: var(--gold-primary); color: black; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; }

        /* --- Toast Notification --- */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); color: white; padding: 12px 25px; border-radius: 50px;
            border: 1px solid var(--gold-primary); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 3000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 10px; min-width: 250px; justify-content: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: var(--gold-primary);
        }
    </style>
</head>
<body>

    <div id="loader">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 40px; margin-bottom: 15px;"></i>
        <p>در حال اتصال به فروشگاه...</p>
    </div>

    <header id="main-header" style="display:none;">
        <div class="header-inner">
            <div class="logo" onclick="app.nav('home')">AMIRKABIR</div>
            <div class="nav-icons">
                <div class="icon-btn" onclick="app.nav('profile')">
                    <i class="fas fa-user"></i>
                </div>
                <div class="icon-btn" onclick="app.nav('cart')">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" id="cart-badge">0</span>
                </div>
                <div class="icon-btn" onclick="auth.logout()" style="color:#ff4757;">
                    <i class="fas fa-power-off"></i>
                </div>
            </div>
        </div>
    </header>

    <div id="page-login" class="page">
        <div class="login-box">
            <h1 style="color:var(--gold-primary); margin-bottom:10px;">عضویت ویژه</h1>
            <p style="color:var(--text-sub); font-size:14px;">برای دسترسی به امکانات لطفا وارد شوید</p>
            <button class="google-btn" onclick="auth.login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                ورود امن با گوگل
            </button>
            <div id="error-msg" style="color:#ff6b6b; margin-top:20px; font-size:12px;"></div>
        </div>
    </div>

    <div id="page-home" class="page">
        <div style="text-align:center; margin-bottom:30px;">
            <h2 style="color:var(--gold-primary);">محصولات برگزیده</h2>
            <p style="color:var(--text-sub); font-size:13px;">جدیدترین تکنولوژی‌های روز دنیا</p>
        </div>
        <div class="grid" id="product-grid"></div>
    </div>

    <div id="page-cart" class="page">
        <h2 style="margin-bottom:20px;">سبد خرید</h2>
        <div class="panel-box">
            <div id="cart-items"></div>
            <div id="cart-summary" style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border); display:none;">
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px;">
                    <span>جمع کل:</span>
                    <span style="color:var(--gold-light);" id="total-price">0 تومان</span>
                </div>
                <button class="save-btn" style="margin-top:20px;" onclick="app.checkout()">تکمیل خرید</button>
            </div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="panel-box">
            <div style="display:flex; align-items:center; gap:20px; margin-bottom:30px;">
                <img src="" id="user-avatar" style="width:70px; height:70px; border-radius:50%; border:2px solid var(--gold-primary);">
                <div>
                    <h3 id="user-name">...</h3>
                    <p id="user-email" style="color:var(--text-sub); font-size:13px;"></p>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="app.switchTab('address', this)">آدرس‌های من</div>
                <div class="tab" onclick="app.switchTab('orders', this)">سفارش‌ها</div>
            </div>

            <div id="tab-address" class="tab-content active">
                <div class="address-form">
                    <p style="color:var(--gold-light); font-size:14px; margin-bottom:5px;">افزودن آدرس جدید:</p>
                    <input type="text" id="addr-title" placeholder="عنوان (مثلا: خانه، محل کار)">
                    <input type="text" id="addr-city" placeholder="شهر">
                    <textarea id="addr-full" rows="2" placeholder="آدرس پستی دقیق..."></textarea>
                    <button class="save-btn" onclick="app.addAddress()">ثبت آدرس</button>
                </div>
                <h4 style="margin-bottom:15px; color:var(--text-sub);">آدرس‌های ثبت شده:</h4>
                <div id="address-list"></div>
            </div>

            <div id="tab-orders" class="tab-content">
                <div id="orders-list"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle" style="color:var(--gold-primary)"></i>
        <span id="toast-msg">پیام سیستم</span>
    </div>

    <script>
        // --- تنظیمات فایربیس ---
        const firebaseConfig = {
            apiKey: "AIzaSyB06UC0JITqaQCU_1toK7M7CUCKusEWrOE",
            authDomain: "amirkabir-3b897.firebaseapp.com",
            projectId: "amirkabir-3b897",
            storageBucket: "amirkabir-3b897.firebasestorage.app",
            messagingSenderId: "902534322032",
            appId: "1:902534322032:web:17fd8194b65777dfd821b5"
        };

        // --- AUTH ---
        const auth = {
            init: function() {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
                    firebase.auth().onAuthStateChanged(user => {
                        document.getElementById('loader').style.display = 'none';
                        if (user) app.initUser(user);
                        else {
                            app.showPage('login');
                            document.getElementById('main-header').style.display = 'none';
                        }
                    });
                });
            },
            login: function() {
                // ریدایرکت برای موبایل ضروری است
                firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());
            },
            logout: function() {
                if(confirm("خروج از حساب؟")) firebase.auth().signOut();
            }
        };

        // --- APP LOGIC ---
        const app = {
            cart: JSON.parse(localStorage.getItem('cart')) || [],
            addresses: JSON.parse(localStorage.getItem('addresses')) || [],
            orders: JSON.parse(localStorage.getItem('orders')) || [],
            
            initUser: function(user) {
                document.getElementById('main-header').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').src = user.photoURL;
                this.renderProducts();
                this.updateCartUI();
                this.renderAddresses();
                this.renderOrders();
                this.showPage('home');
            },

            showPage: function(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + pageId).classList.add('active');
            },
            nav: function(p) { this.showPage(p); },

            // --- Products ---
            renderProducts: function() {
                const products = [
                    { id: 1, name: "آیفون ۱۳ پرومکس", price: 55000000, icon: "fa-mobile-alt" },
                    { id: 2, name: "مک‌بوک پرو M2", price: 85000000, icon: "fa-laptop" },
                    { id: 3, name: "هدفون سونی XM5", price: 14000000, icon: "fa-headphones" },
                    { id: 4, name: "ساعت هوشمند اولترا", price: 35000000, icon: "fa-clock" },
                    { id: 5, name: "پلی استیشن ۵", price: 26000000, icon: "fa-gamepad" },
                    { id: 6, name: "دوربین کانن", price: 42000000, icon: "fa-camera" }
                ];
                document.getElementById('product-grid').innerHTML = products.map(p => `
                    <div class="card">
                        <div class="card-img"><i class="fas ${p.icon}"></i></div>
                        <h3>${p.name}</h3>
                        <div style="color:var(--gold-light); margin:10px 0;">${p.price.toLocaleString()} تومان</div>
                        <button class="add-btn" onclick="app.addToCart(${p.id}, '${p.name}', ${p.price})">افزودن به سبد</button>
                    </div>
                `).join('');
            },

            // --- Cart ---
            addToCart: function(id, name, price) {
                this.cart.push({id, name, price});
                this.saveData();
                this.updateCartUI();
                this.showToast(name + " اضافه شد");
            },
            removeFromCart: function(index) {
                this.cart.splice(index, 1);
                this.saveData();
                this.updateCartUI();
            },
            updateCartUI: function() {
                document.getElementById('cart-badge').innerText = this.cart.length;
                const container = document.getElementById('cart-items');
                const summary = document.getElementById('cart-summary');
                
                if (this.cart.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-sub);">سبد خرید خالی است</p>';
                    summary.style.display = 'none';
                    return;
                }
                
                summary.style.display = 'block';
                let total = 0;
                container.innerHTML = this.cart.map((item, i) => {
                    total += item.price;
                    return `
                    <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
                        <span>${item.name}</span>
                        <div style="display:flex; gap:15px; align-items:center;">
                            <span>${item.price.toLocaleString()}</span>
                            <i class="fas fa-trash" style="color:#ff4757; cursor:pointer;" onclick="app.removeFromCart(${i})"></i>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('total-price').innerText = total.toLocaleString() + ' تومان';
            },

            // --- Address Logic (NEW) ---
            addAddress: function() {
                const title = document.getElementById('addr-title').value;
                const city = document.getElementById('addr-city').value;
                const full = document.getElementById('addr-full').value;

                if (!title || !city || !full) return alert("لطفا تمام فیلدها را پر کنید");

                this.addresses.push({ title, city, full });
                this.saveData();
                this.renderAddresses();
                this.showToast("آدرس با موفقیت ثبت شد");
                
                // پاک کردن فرم
                document.getElementById('addr-title').value = '';
                document.getElementById('addr-city').value = '';
                document.getElementById('addr-full').value = '';
            },
            deleteAddress: function(index) {
                if(confirm("حذف این آدرس؟")) {
                    this.addresses.splice(index, 1);
                    this.saveData();
                    this.renderAddresses();
                }
            },
            renderAddresses: function() {
                const list = document.getElementById('address-list');
                if (this.addresses.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-sub); font-size:12px;">هیچ آدرسی ثبت نشده است.</p>';
                    return;
                }
                list.innerHTML = this.addresses.map((addr, i) => `
                    <div class="address-card">
                        <div>
                            <strong style="color:var(--gold-primary);">${addr.title}</strong>
                            <div style="font-size:12px; color:var(--text-sub); margin-top:5px;">${addr.city} - ${addr.full}</div>
                        </div>
                        <i class="fas fa-trash-alt" style="color:#ff4757; cursor:pointer; padding:5px;" onclick="app.deleteAddress(${i})"></i>
                    </div>
                `).join('');
            },

            // --- Orders ---
            checkout: function() {
                if (this.addresses.length === 0) return alert("لطفا ابتدا یک آدرس ثبت کنید!");
                if (confirm("ثبت نهایی سفارش؟")) {
                    const total = document.getElementById('total-price').innerText;
                    this.orders.push({
                        id: 'ORD-' + Math.floor(Math.random()*10000),
                        date: new Date().toLocaleDateString('fa-IR'),
                        items: this.cart.length,
                        total: total
                    });
                    this.cart = [];
                    this.saveData();
                    this.updateCartUI();
                    this.renderOrders();
                    this.switchTab('orders', document.querySelectorAll('.tab')[1]);
                    this.nav('profile');
                    this.showToast("سفارش شما با موفقیت ثبت شد");
                }
            },
            renderOrders: function() {
                const list = document.getElementById('orders-list');
                if (this.orders.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:var(--text-sub); margin-top:20px;">هنوز خریدی انجام نداده‌اید.</p>';
                    return;
                }
                list.innerHTML = this.orders.map(o => `
                    <div style="background:var(--bg-body); padding:15px; border-radius:10px; margin-bottom:10px; border:1px solid var(--border);">
                        <div style="display:flex; justify-content:space-between; color:var(--gold-primary); font-weight:bold;">
                            <span>${o.id}</span>
                            <span style="font-size:12px; background:rgba(76, 209, 55, 0.2); color:#4cd137; padding:2px 8px; border-radius:10px;">پرداخت موفق</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:13px; margin-top:10px; color:var(--text-sub);">
                            <span>${o.items} محصول</span>
                            <span>${o.total}</span>
                        </div>
                        <div style="font-size:11px; color:#666; margin-top:5px;">${o.date}</div>
                    </div>
                `).join('');
            },

            // --- Utils ---
            switchTab: function(tabName, el) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                if(el) el.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tabName).classList.add('active');
            },
            saveData: function() {
                localStorage.setItem('cart', JSON.stringify(this.cart));
                localStorage.setItem('addresses', JSON.stringify(this.addresses));
                localStorage.setItem('orders', JSON.stringify(this.orders));
            },
            showToast: function(msg) {
                const t = document.getElementById('toast');
                document.getElementById('toast-msg').innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        };

        window.onload = () => auth.init();
    </script>
</body>
</html>
