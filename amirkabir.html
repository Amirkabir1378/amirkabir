<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه لوکس امیرکبیر</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        /* --- تنظیمات تم طلایی (Luxury Gold Theme) --- */
        :root {
            --gold-primary: #d4af37;       /* طلایی اصلی */
            --gold-light: #f1d570;         /* طلایی روشن */
            --gold-dark: #aa8c2c;          /* طلایی تیره */
            --bg-body: #121212;            /* مشکی تیره */
            --bg-card: #1e1e1e;            /* خاکستری تیره */
            --text-main: #ffffff;          /* متن سفید */
            --text-sub: #b3b3b3;           /* متن خاکستری */
            --border: #333333;
            --radius: 15px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; outline: none; }
        
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-top: 80px;
            overflow-x: hidden;
        }

        button { cursor: pointer; border: none; font-family: inherit; transition: 0.3s; }
        a { text-decoration: none; color: inherit; cursor: pointer; }

        /* --- Header --- */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gold-dark);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .header-inner {
            width: 100%; max-width: 1400px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-size: 28px; font-weight: 900;
            background: linear-gradient(45deg, var(--gold-primary), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .nav-icons { display: flex; gap: 15px; align-items: center; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--border); color: var(--gold-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; border: 1px solid transparent;
        }
        .icon-btn:hover { border-color: var(--gold-primary); transform: scale(1.1); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--gold-primary); color: #000;
            font-size: 11px; width: 20px; height: 20px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold;
        }

        /* --- Pages --- */
        .page { display: none; max-width: 1400px; margin: 0 auto; padding: 20px; animation: fadeIn 0.5s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Login Page --- */
        .login-box {
            background: var(--bg-card); padding: 50px; border-radius: 20px;
            text-align: center; max-width: 400px; margin: 80px auto;
            border: 1px solid var(--gold-dark);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
        }
        .google-btn {
            width: 100%; background: #fff; color: #333;
            padding: 15px; border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 30px; font-size: 15px;
        }
        .google-btn:hover { background: #f0f0f0; }

        /* --- Home Page --- */
        .hero {
            background: linear-gradient(135deg, #000000 0%, #2c2408 100%);
            border: 1px solid var(--gold-dark);
            border-radius: 20px; padding: 60px; margin-bottom: 40px;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        .hero h1 { font-size: 3rem; color: var(--gold-primary); margin-bottom: 10px; }
        .hero::after {
            content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.2), transparent 50%);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 20px;
            border: 1px solid var(--border); position: relative;
            transition: 0.4s; overflow: hidden;
        }
        .card:hover { border-color: var(--gold-primary); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-img {
            height: 200px; background: #000; border-radius: 10px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 60px; color: var(--gold-primary);
        }
        .card h3 { margin-bottom: 5px; color: var(--text-main); }
        .card .price { color: var(--gold-light); font-size: 18px; font-weight: bold; }
        .add-btn {
            width: 100%; padding: 12px; margin-top: 15px;
            background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-primary);
            border-radius: 10px; font-weight: bold;
        }
        .add-btn:hover { background: var(--gold-primary); color: #000; }

        /* --- Cart & Profile --- */
        .panel-box { background: var(--bg-card); border-radius: var(--radius); padding: 30px; border: 1px solid var(--border); }
        .cart-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 0; border-bottom: 1px solid var(--border);
        }
        .checkout-btn {
            width: 100%; background: linear-gradient(45deg, var(--gold-dark), var(--gold-primary));
            color: #000; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 20px;
        }

        /* Profile Tabs */
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--gold-primary); }
        .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .tab { padding: 10px 0; color: var(--text-sub); cursor: pointer; position: relative; }
        .tab.active { color: var(--gold-primary); font-weight: bold; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; right: 0; width: 100%; height: 3px; background: var(--gold-primary); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: right; color: var(--text-sub); padding: 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
        td { padding: 15px 10px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        .status-paid { color: #4cd137; background: rgba(76, 209, 55, 0.1); padding: 5px 10px; border-radius: 15px; font-size: 12px; }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: var(--gold-primary);
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid var(--border);
            border-top: 3px solid var(--gold-primary); border-radius: 50%;
            animation: spin 1s infinite linear; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>در حال بارگذاری...</p>
    </div>

    <header id="main-header" style="display:none;">
        <div class="header-inner">
            <div class="logo" onclick="app.nav('home')">AMIRKABIR <span style="font-size:12px; color:var(--text-sub)">LUXURY</span></div>
            <div class="nav-icons">
                <div class="icon-btn" onclick="app.nav('profile')" style="position:relative;">
                    <i class="fas fa-user"></i>
                </div>
                <div class="icon-btn" onclick="app.nav('cart')" style="position:relative;">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" id="cart-badge">0</span>
                </div>
                <div class="icon-btn" onclick="auth.logout()" style="color:#ff4757; border-color:transparent;">
                    <i class="fas fa-power-off"></i>
                </div>
            </div>
        </div>
    </header>

    <div id="page-login" class="page">
        <div class="login-box">
            <h1 style="color:var(--gold-primary); margin-bottom: 10px;">عضویت ویژه</h1>
            <p style="color:var(--text-sub);">به باشگاه مشتریان خاص امیرکبیر بپیوندید</p>
            <button class="google-btn" onclick="auth.login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                ورود امن با حساب گوگل
            </button>
        </div>
    </div>

    <div id="page-home" class="page">
        <div class="hero">
            <div>
                <h1>کالکشن طلایی ۱۴۰۴</h1>
                <p style="color:var(--text-sub); font-size:18px; margin-top:10px;">تکنولوژی در اوج شکوه و زیبایی</p>
            </div>
            <i class="fas fa-gem" style="font-size:100px; color:var(--gold-primary); opacity:0.8;"></i>
        </div>

        <h3 style="color:var(--gold-light); margin-bottom:20px; border-right:4px solid var(--gold-primary); padding-right:15px;">محصولات منتخب</h3>
        <div class="grid" id="product-grid"></div>
    </div>

    <div id="page-cart" class="page">
        <h2 style="color:var(--gold-primary); margin-bottom:20px;">سبد خرید شما</h2>
        <div class="panel-box">
            <div id="cart-items"></div>
            <div id="cart-summary" style="margin-top:30px; border-top:1px solid var(--border); padding-top:20px;">
                <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:bold;">
                    <span>مبلغ قابل پرداخت:</span>
                    <span style="color:var(--gold-light);" id="total-price">0 تومان</span>
                </div>
                <button class="checkout-btn" onclick="app.checkout()">نهایی کردن سفارش</button>
            </div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="panel-box">
            <div class="profile-header">
                <img src="" id="user-avatar" class="avatar">
                <div>
                    <h2 id="user-name" style="color:var(--text-main);">...</h2>
                    <p id="user-email" style="color:var(--gold-primary); font-size:14px; margin-top:5px;"></p>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="app.switchTab('orders')">سفارش‌های من</div>
                <div class="tab" onclick="alert('به زودی...')">آدرس‌ها</div>
            </div>

            <div id="tab-orders">
                <table id="orders-table">
                    <thead>
                        <tr>
                            <th>کد سفارش</th>
                            <th>محصولات</th>
                            <th>مبلغ کل</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- تنظیمات فایربیس (کدی که فرستادید) ---
        const firebaseConfig = {
            apiKey: "AIzaSyB06UC0JITqaQCU_1toK7M7CUCKusEWrOE",
            authDomain: "amirkabir-3b897.firebaseapp.com",
            projectId: "amirkabir-3b897",
            storageBucket: "amirkabir-3b897.firebasestorage.app",
            messagingSenderId: "902534322032",
            appId: "1:902534322032:web:17fd8194b65777dfd821b5"
        };

        // --- دیتابیس محصولات ---
        const productsDB = [
            { id: 1, name: "آیفون ۱۳ پرومکس - گلد", price: 65000000, icon: "fa-mobile-alt" },
            { id: 2, name: "مک‌بوک پرو M2 سفارشی", price: 95000000, icon: "fa-laptop" },
            { id: 3, name: "ساعت رولکس هوشمند", price: 120000000, icon: "fa-clock" },
            { id: 4, name: "هدفون سونی با روکش طلا", price: 25000000, icon: "fa-headphones" },
            { id: 5, name: "کنسول PS5 نسخه لیمیتد", price: 35000000, icon: "fa-gamepad" },
            { id: 6, name: "دوربین لایکا حرفه‌ای", price: 180000000, icon: "fa-camera" },
        ];

        // --- Auth Manager ---
        const auth = {
            user: null,
            init: function() {
                firebase.initializeApp(firebaseConfig);
                firebase.auth().onAuthStateChanged(user => {
                    document.getElementById('loader').style.display = 'none';
                    if (user) {
                        this.user = user;
                        app.initUser(user);
                    } else {
                        this.user = null;
                        app.showPage('login');
                        document.getElementById('main-header').style.display = 'none';
                    }
                });
            },
            login: function() {
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider).catch(e => alert(e.message));
            },
            logout: function() {
                if(confirm("خارج می‌شوید؟")) firebase.auth().signOut();
            }
        };

        // --- App Logic ---
        const app = {
            cart: JSON.parse(localStorage.getItem('cart')) || [],
            orders: JSON.parse(localStorage.getItem('orders')) || [],

            initUser: function(user) {
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').src = user.photoURL;
                document.getElementById('main-header').style.display = 'flex';
                
                this.renderProducts();
                this.updateCartUI();
                this.renderOrders();
                this.showPage('home');
            },

            showPage: function(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + pageId).classList.add('active');
            },

            nav: function(page) {
                this.showPage(page);
            },

            // --- Products ---
            renderProducts: function() {
                const container = document.getElementById('product-grid');
                container.innerHTML = productsDB.map(p => `
                    <div class="card">
                        <div class="card-img"><i class="fas ${p.icon}"></i></div>
                        <h3>${p.name}</h3>
                        <div class="price">${p.price.toLocaleString()} تومان</div>
                        <button class="add-btn" onclick="app.addToCart(${p.id})">افزودن به سبد</button>
                    </div>
                `).join('');
            },

            // --- Cart ---
            addToCart: function(id) {
                const product = productsDB.find(p => p.id === id);
                this.cart.push(product);
                this.saveCart();
                this.updateCartUI();
                alert('به سبد خرید اضافه شد');
            },

            removeFromCart: function(index) {
                this.cart.splice(index, 1);
                this.saveCart();
                this.updateCartUI();
            },

            saveCart: function() {
                localStorage.setItem('cart', JSON.stringify(this.cart));
            },

            updateCartUI: function() {
                document.getElementById('cart-badge').innerText = this.cart.length;
                
                const container = document.getElementById('cart-items');
                if (this.cart.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-sub); text-align:center;">سبد خرید خالی است</p>';
                    document.getElementById('total-price').innerText = "0 تومان";
                    return;
                }

                let total = 0;
                container.innerHTML = this.cart.map((item, index) => {
                    total += item.price;
                    return `
                        <div class="cart-item">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <i class="fas ${item.icon}" style="color:var(--gold-primary);"></i>
                                <span>${item.name}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:15px;">
                                <span>${item.price.toLocaleString()}</span>
                                <i class="fas fa-trash" style="color:#ff4757; cursor:pointer;" onclick="app.removeFromCart(${index})"></i>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('total-price').innerText = total.toLocaleString() + " تومان";
            },

            // --- Checkout & Orders ---
            checkout: function() {
                if (this.cart.length === 0) return alert("سبد خالی است!");
                
                if (confirm("آیا مبلغ پرداخت شود؟")) {
                    const newOrder = {
                        id: "ORD-" + Math.floor(Math.random() * 10000),
                        items: this.cart.length,
                        total: document.getElementById('total-price').innerText,
                        date: new Date().toLocaleDateString('fa-IR')
                    };
                    
                    this.orders.push(newOrder);
                    localStorage.setItem('orders', JSON.stringify(this.orders));
                    
                    this.cart = [];
                    this.saveCart();
                    this.updateCartUI();
                    this.renderOrders();
                    
                    alert("پرداخت موفق! سفارش شما ثبت شد.");
                    this.nav('profile');
                }
            },

            renderOrders: function() {
                const tbody = document.getElementById('orders-body');
                if (this.orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">هنوز سفارشی ندارید</td></tr>';
                    return;
                }
                tbody.innerHTML = this.orders.map(o => `
                    <tr>
                        <td style="color:var(--gold-primary);">${o.id}</td>
                        <td>${o.items} محصول</td>
                        <td>${o.total}</td>
                        <td><span class="status-paid">پرداخت موفق</span></td>
                    </tr>
                `).join('');
            }
        };

        window.onload = () => auth.init();
    </script>
</body>
</html>
