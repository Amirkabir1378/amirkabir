<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به امیرکبیر</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body { background-color: #121212; color: #fff; font-family: 'Vazirmatn', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e1e1e; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #aa8c2c; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .logo { font-size: 30px; font-weight: 900; color: #d4af37; margin-bottom: 10px; }
        .google-btn { width: 100%; background: #fff; color: #333; padding: 12px; border-radius: 50px; font-weight: bold; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 30px; cursor: pointer; transition: 0.3s; }
        .google-btn:active { transform: scale(0.95); }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; justify-content: center; align-items: center; color: #d4af37; }
    </style>
</head>
<body>

    <div id="loader">در حال بررسی وضعیت...</div>

    <div class="login-box">
        <div class="logo">AMIRKABIR</div>
        <p style="color:#b3b3b3;">ورود اعضای ویژه</p>
        <button class="google-btn" onclick="login()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            ورود با گوگل
        </button>
        <p id="msg" style="margin-top:20px; font-size:12px; color:#ff6b6b;"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB06UC0JITqaQCU_1toK7M7CUCKusEWrOE",
            authDomain: "amirkabir-3b897.firebaseapp.com",
            projectId: "amirkabir-3b897",
            storageBucket: "amirkabir-3b897.firebasestorage.app",
            messagingSenderId: "902534322032",
            appId: "1:902534322032:web:17fd8194b65777dfd821b5"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        // بررسی وضعیت لاگین
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loader').innerText = "خوش آمدید! انتقال به فروشگاه...";
                // انتقال به فایل دوم
                window.location.href = "shop.html";
            } else {
                document.getElementById('loader').style.display = 'none';
            }
        });

        // دریافت نتیجه بازگشت از گوگل
        firebase.auth().getRedirectResult().catch(error => {
            document.getElementById('msg').innerText = "خطا: " + error.message;
        });

        function login() {
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loader').innerText = "اتصال به گوگل...";
            var provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithRedirect(provider);
        }
    </script>
</body>
</html>
